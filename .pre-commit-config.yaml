default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
default_stages: [pre-commit, pre-merge-commit, pre-push, manual]

# Hook tools come from uv.lock, or for the Node-based Renovate validator from a pinned bunx package, rather than
# pre-commit's own environments, so Renovate bumps them with the rest.
repos:
  - repo: local
    hooks:
      # --no-global validates the named files as repository config, not as self-hosted global config.
      - id: renovate-config-validator
        name: validate renovate config
        entry: bunx --package renovate@44.260.0 renovate-config-validator --strict --no-global
        language: system
        files: (^|/)\.?renovate(rc)?(\.json[c5]?)?$

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run end-of-file-fixer
        language: system
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run check-merge-conflict
        language: system
        types: [text]

      - id: mixed-line-ending
        name: mixed line ending
        entry: uv run mixed-line-ending
        language: system
        types: [text]
        args: [--fix=lf]

      - id: check-yaml
        name: check yaml
        entry: uv run check-yaml
        language: system
        types: [yaml]

      # Changes go into the default branch only through pull requests.
      - id: no-commit-to-branch
        name: don't commit to branch
        entry: uv run no-commit-to-branch
        language: system
        pass_filenames: false
        always_run: true
        args: [--branch, main]

      # actionlint reads workflows only; the published actions' metadata needs the schema check.
      - id: check-github-actions
        name: validate action metadata
        entry: uv run check-jsonschema --builtin-schema vendor.github-actions
        language: system
        files: (^|/)action\.ya?ml$

      # Runs shellcheck on run: scripts when shellcheck is on PATH, which uv run provides.
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        files: ^\.github/workflows/.+\.ya?ml$
