name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.4.0; empty bumps the latest release's minor version
        required: false
        default: ''
  # A weekly release ships whatever landed since the last one, such as Renovate's bumps of the actions' own pins.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Resolve version
        id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const semver = /^v(\d+)\.(\d+)\.(\d+)$/;

            let previous = '';
            try {
              previous = (await github.rest.repos.getLatestRelease({ owner, repo })).data.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            let version = process.env.VERSION.trim();
            if (version) {
              if (!version.startsWith('v')) version = `v${version}`;
              if (!semver.test(version)) {
                core.setFailed(`Version ${version} is not vMAJOR.MINOR.PATCH`);
                return;
              }
            } else if (previous) {
              const match = semver.exec(previous);
              if (!match) {
                core.setFailed(`Latest release ${previous} is not vMAJOR.MINOR.PATCH; pass a version`);
                return;
              }
              version = `v${match[1]}.${Number(match[2]) + 1}.0`;
            } else {
              version = 'v1.0.0';
            }

            // Releases are immutable: a tag is never moved or overwritten.
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${version}` });
              core.setFailed(`Tag ${version} already exists`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // Only a version above the latest release becomes the latest, so the next bump starts from the highest.
            const prev = semver.exec(previous)?.slice(1).map(Number);
            const next = semver.exec(version).slice(1).map(Number);
            const differs = prev ? next.findIndex((part, i) => part !== prev[i]) : -1;
            const latest = !prev || (differs >= 0 && next[differs] > prev[differs]);

            core.info(`Releasing ${version}${previous ? ` after ${previous}` : ''}${latest ? '' : ' (not latest)'}`);
            core.setOutput('version', version);
            core.setOutput('previous', previous);
            core.setOutput('latest', String(latest));

      # The release ships only the actions, LICENSE and README.md.
      - name: Build the stripped tree
        id: tree
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const commit = (await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha })).data;
            const root = (await github.rest.git.getTree({ owner, repo, tree_sha: commit.tree.sha })).data.tree;

            const kept = [];
            for (const entry of root) {
              if (entry.type === 'blob' && ['LICENSE', 'README.md'].includes(entry.path)) {
                kept.push(entry);
              } else if (entry.type === 'tree') {
                const files = (await github.rest.git.getTree({ owner, repo, tree_sha: entry.sha })).data.tree;
                if (files.some((file) => file.type === 'blob' && ['action.yml', 'action.yaml'].includes(file.path))) {
                  kept.push(entry);
                }
              }
            }
            core.info(`Shipping: ${kept.map((entry) => entry.path).join(', ')}`);

            const tree = (await github.rest.git.createTree({
              owner,
              repo,
              tree: kept.map(({ path, mode, type, sha }) => ({ path, mode, type, sha })),
            })).data;
            core.setOutput('tree', tree.sha);

            // Identical contents hash to the identical tree, so an unchanged release is a tree SHA match.
            const previous = process.env.PREVIOUS;
            if (previous) {
              const released = (await github.rest.repos.getCommit({ owner, repo, ref: previous })).data;
              if (released.commit.tree.sha === tree.sha) {
                core.notice(`Nothing changed since ${previous}; skipping the release`);
                core.setOutput('changed', 'false');
                return;
              }
            }
            core.setOutput('changed', 'true');

      # The release commit sits on top of the released main commit, so log and blame on a tag show the real history.
      - name: Create the release commit
        if: steps.tree.outputs.changed == 'true'
        id: commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TREE: ${{ steps.tree.outputs.tree }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;

            const commit = (await github.rest.git.createCommit({
              owner,
              repo,
              message: `Release ${version}\n\nStrip everything but the actions, LICENSE and README.md.`,
              tree: process.env.TREE,
              parents: [context.sha],
            })).data;

            core.info(`Created release commit ${commit.sha}`);
            core.setOutput('commit', commit.sha);

      # createRelease also creates the tag, so a failed run leaves neither behind and can simply be rerun.
      - name: Tag and create the release
        if: steps.tree.outputs.changed == 'true'
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          LATEST: ${{ steps.version.outputs.latest }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;
            const previous = process.env.PREVIOUS;
            const commit = process.env.COMMIT;

            const notes = (await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: version,
              target_commitish: commit,
              ...(previous && { previous_tag_name: previous }),
            })).data;

            let body = notes.body;
            if (previous) {
              // Two dots compare the stripped trees directly; three would diff against main and show every
              // file the release leaves out as deleted.
              const diff = `${context.serverUrl}/${owner}/${repo}/compare/${previous}..${version}`;
              body += `\n\n**Release diff**: ${diff}`;
            }

            const release = (await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: version,
              target_commitish: commit,
              name: version,
              body,
              make_latest: process.env.LATEST,
            })).data;
            core.notice(`Released ${release.html_url}`);
