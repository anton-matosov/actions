name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
  BUN_VERSION: 1.4.5

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  paths-filter:
    name: Need to run?
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 10
    outputs:
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      # A local action needs the repository on disk before it can run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        uses: ./paths-filter
        with:
          force: ${{ github.event_name == 'workflow_dispatch' }}
          filters: |
            - 'paths-filter/**'
            - 'ci-finished/**'
            - '.github/scripts/**'
            - 'bunfig.toml'
            - '.github/workflows/ci.yml'

  ci-finished-test:
    name: Test ci-finished action
    needs: paths-filter
    if: needs.paths-filter.outputs.pass == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Success and skipped pass
        uses: ./ci-finished
        with:
          needs: '{"a": {"result": "success"}, "b": {"result": "skipped"}}'

      - name: Failure fails
        id: failure
        continue-on-error: true
        uses: ./ci-finished
        with:
          needs: '{"a": {"result": "success"}, "b": {"result": "failure"}}'

      - name: Cancelled fails
        id: cancelled
        continue-on-error: true
        uses: ./ci-finished
        with:
          needs: '{"a": {"result": "cancelled"}}'

      - name: Expect both to have failed
        if: steps.failure.outcome != 'failure' || steps.cancelled.outcome != 'failure'
        run: exit 1

  # Not gated on paths-filter: a broken pass output would skip this job along with everything it gates.
  paths-filter-test:
    name: Test paths-filter action
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Force passes
        id: forced
        uses: ./paths-filter
        with:
          force: 'true'
          filters: |
            - 'does-not-exist/**'

      - name: No match fails
        id: unmatched
        uses: ./paths-filter
        with:
          force: 'false'
          filters: |
            - 'does-not-exist/**'

      # A pull request always changes at least one file; a push or manual run can compare a commit with itself.
      - name: Match passes
        id: matched
        if: github.event_name == 'pull_request'
        uses: ./paths-filter
        with:
          force: 'false'
          filters: |
            - '**'

      - name: Expect pass when forced or matched
        if: >-
          steps.forced.outputs.pass != 'true' || steps.unmatched.outputs.pass != 'false' ||
          (github.event_name == 'pull_request' && steps.matched.outputs.pass != 'true')
        env:
          FORCED: ${{ steps.forced.outputs.pass }}
          UNMATCHED: ${{ steps.unmatched.outputs.pass }}
          MATCHED: ${{ steps.matched.outputs.pass }}
        run: |
          echo "::error::forced pass=$FORCED (want true), unmatched pass=$UNMATCHED (want false), matched pass=$MATCHED (want true on pull_request)"
          exit 1

  scripts-test:
    name: Test workflow scripts
    needs: paths-filter
    if: needs.paths-filter.outputs.pass == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun test

  pre-commit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # The Renovate config validator hook runs through bunx.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run every hook on every file
        env:
          # A push to main is a merged pull request, not a direct commit.
          SKIP: no-commit-to-branch
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  # The validator checks the config's shape; only a lookup against the real dependencies shows which rules apply to
  # which pins. Read the debug log for each dependency's currentValue, newValue and resolved settings.
  # Runs on Node, not bunx: a full Renovate run refuses any runtime outside its supported Node versions.
  renovate-dry-run:
    name: Renovate dry run
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Look up every update without opening pull requests
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.260.0
          LOG_LEVEL: debug
          # Lifts the anonymous API rate limit for the GitHub tag and release lookups.
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: npx --yes "renovate@${RENOVATE_VERSION}" --platform=local --dry-run=lookup

  finished:
    name: CI finished
    needs: [paths-filter, paths-filter-test, ci-finished-test, scripts-test, pre-commit, renovate-dry-run]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./ci-finished
        with:
          needs: ${{ toJSON(needs) }}
